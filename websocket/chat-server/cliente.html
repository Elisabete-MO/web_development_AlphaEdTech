<!DOCTYPE html>
<html>

<head>
    <title>Chat WebSocket</title>
</head>

<body>
    <h1>Chat WebSocket</h1>
    <input type="text" id="mensagem" placeholder="Digite sua mensagem">
    <button id="enviar">Enviar</button>
    <div id="chat" style="border:1px solid #ccc; height:300px; overflow-y:scroll;
padding:10px; margin-top:10px;"></div>
    <script>
        const ws = new WebSocket('ws://localhost:8080');
        const chat = document.getElementById('chat');
        const input = document.getElementById('mensagem');
        ws.onopen = () => {
            chat.innerHTML += '<p style="color:green;">✅ Conectado ao chat</p>';
        };
        ws.onmessage = (event) => {
            chat.innerHTML += `<p><strong>${event.data}</strong></p>`;
            chat.scrollTop = chat.scrollHeight;
        };
        ws.onclose = () => {
            chat.innerHTML += '<p style="color:red;">❌ Desconectado</p>';
        };
        document.getElementById('enviar').onclick = () => {
            const msg = input.value.trim();
            if (msg && ws.readyState === WebSocket.OPEN) {
                ws.send(msg);
                input.value = '';
            }
        };
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('enviar').click();
            }
        });
    </script>
</body>

</html>
