<!DOCTYPE html>
<html>

<head>
    <title>Chat</title>
</head>

<body>
    <input type="text" id="msg" placeholder="Digite sua mensagem">
    <button id="btn">Enviar</button>
    <div id="chat" style="border:1px solid #ccc; height:300px; overflow-y:auto;
padding:10px;"></div>
    <script>
        const ws = new WebSocket('ws://localhost:8080');
        const chat = document.getElementById('chat');
        const input = document.getElementById('msg');
        let digitandoTimer = null;
        ws.onmessage = (e) => {
            chat.innerHTML += `<p>${e.data}</p>`;
            chat.scrollTop = chat.scrollHeight;
        };
        document.getElementById('btn').onclick = () => {
            const t = input.value.trim();
            if (t) { ws.send(t); input.value = ''; }
        };
        input.onkeydown = () => {
            if (digitandoTimer) clearTimeout(digitandoTimer);
            ws.send('/digitando');
            digitandoTimer = setTimeout(() => { }, 2000);
        };
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('btn').click();
        });
    </script>
</body>

</html>
