apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              cat > /etc/nginx/conf.d/default.conf <<'EOF'
              server {
                listen 3000;

                location /health {
                  default_type text/plain;
                  return 200 'ok\n';
                }

                location / {
                  default_type text/plain;
                  return 200 'API funcionando\n';
                }
              }
              EOF
              exec nginx -g 'daemon off;'
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: wrong-secret
            - secretRef:
                name: api-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
